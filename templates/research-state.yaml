# research-state.yaml — topic-to-paper 唯一状态源
# 每阶段末更新。resume 时只读这个文件。

project:
  title: ""
  topic: ""
  started: ""              # YYYY-MM-DD
  entry: ""                # topic_only | topic_plus_data | have_results | have_draft | have_reviews

target:
  venue: ""
  deadline: ""
  guide_file: submission/guide.txt
  page_limit: null
  word_limit: null
  abstract_word_limit: null
  keyword_max: null
  ref_max: null
  columns: single           # single | double
  min_dpi: 300
  blind: false
  field: ""               # cv | ml | medimg | nature：加载 references/acronym-norms.csv 的领域缩略语规范
  family: ""              # cs_conf | cs_journal | nature：写法画像（references/venue-profiles.md），空则由 venue 名推断；决定章节顺序、篇幅、禁用词、统计写法
  required_files: []        # 从 guide 抄
  latex_dir: paper/latex    # 有 LaTeX 模板的刊：main.tex 在这里（latex_check.py skeleton 生成），paper/manuscript.md 由 tex_to_md.py 派生
  latex_class: ""           # 期望的 documentclass（如 elsarticle / IEEEtran）；填了之后 G6d 对不上就 FAIL
  figure_ext: pdf           # \includegraphics 允许的扩展名；图一律 PDF，组合图每个面板一个 PDF

resources:
  gpu: ""                   # 型号与显存
  gpu_shared_with: ""       # 其它会话/用户
  data:
    - name: ""
      path: ""
      size_gb: null
      license: ""
      access_confirmed: false

phase:
  current: P0               # P0..P8
  history: []               # - {phase: P1, done: YYYY-MM-DD}

gates:                      # 由 `t2p.py check` 写回：status pass|fail|crash|pending|skip|n/a，evidence，checked 时间；手工只填 *_sha256（综述分支用 G-S0..G-S6）
  G0: {status: pending, evidence: ""}
  G1: {status: pending, evidence: ""}
  G1b: {status: pending, evidence: ""}
  G2: {status: pending, evidence: "", prereg_sha256: ""}
  G3: {status: pending, evidence: ""}
  G4: {status: pending, evidence: ""}
  G5: {status: pending, evidence: ""}
  G6: {status: pending, evidence: gate_report.md}
  G6b: {status: pending, evidence: ""}
  G6c: {status: pending, evidence: ""}
  G6e: {status: pending, evidence: ""}
  G7: {status: pending, evidence: ""}
  G8: {status: pending, evidence: ""}

claim:
  statement: ""
  primary_metric: ""
  denominator: ""           # 归一化分母定义，跨数据集是否一致
  inclusion_window: ""      # 纳入窗口
  prediction: ""            # 事前预测的符号与量级

audits:                     # P3 三项审计 + 完成度，全部由 scripts/audit_check.py 机械执行
  runs_dir: runs
  args_file: args.json
  log_file: log.json        # 每 epoch 一条 dict 的 list，或 dict of lists
  epochs_key: epochs        # args 里"应有多少条 log"的键；训完判据 = log 条数 ≥ 它
  main_table_runs: []       # 进主表的 run 名；空 = 审计全部
  leak_flags: []            # 任何"目标域标签/数据进训练"类开关名，主表 run 必须全为 0，如 [use_B_train, B_labels]
  split_key: ""             # 划分键：subject / clip / batch，不是 sample
  split_files: {train: "", test: ""}   # 导出的 train/test 分组 id 列表（csv/json/txt），有则机械核对无重叠
  min_group_size: 5         # 样本数低于此的分组必须丢弃，不得并入邻组
  critical_params: {}       # args 键 -> 日志证据列，如 {beta: train_dom, alpha: train_cons}；值为 null 时按名搜索
  code_dirs: [code]
  inputs: []                # 缺失时必须报错的输入名，如 [frames, frames_256.npy]；静态扫描 + 烟测都用
  smoke_cmd: ""             # 如 "python code/train.py --data_A {data} --epochs 1 --exp _smoke"；{data} = 删掉一个输入的临时副本
  smoke_data: ""            # 小数据根目录
  hardware_key: hardware    # args/log 里记录 GPU 型号的键；缺 WARN，主表混用 FAIL

bundle:                     # P3/P4 远程实验包，scripts/bundle.py make|check|tables（用户上传跑、传回结果的工作流）
  code_dir: code
  entry: "python train.py --exp {run} {args}"      # {run} = run_id，{args} = matrix 里的参数串
  eval: "python eval.py --exp {runs}"              # 训完对该 run 出 eval.json；空则 G4 无法溯源
  post: ""                                         # 可选：逐样本预测导出等，如 "python agentic.py dump --exp {runs}"
  env: requirements.txt
  python_min: "3.9"
  import_check: [numpy, torch]
  min_vram_gb: 8
  min_disk_gb: 20
  data:                                            # check_env 逐项核对 remote 下每个 clip 的 inputs
    - {name: data_A, remote: /path/on/server/data_A, inputs: [], clip_glob: "*"}   # inputs 空 = 用 audits.inputs；clip_glob 只查用到的子目录
  scheduler: bash                                  # bash | slurm
  slurm: {partition: gpu, gres: "gpu:1", time: "12:00:00", mem: 32G, cpus: 8, max_parallel: 4, modules: [], conda: ""}
  smoke: {args: "--epochs 1", runs: [], eval: ""}  # runs 空 = 只跑 ref；eval 非空 = 烟测专用的短评估命令（正式 eval 可能要跑几十分钟）
  matrix:
    seeds: [0, 1, 2]
    seed_flag: "--seed {seed}"
    seeded: []                                     # 哪些方法跑全部 seeds（空 = 只有 ref）；其余只跑 seeds[0]
    ref: {name: ours, args: "--model ours"}
    baselines: {}                                  # name: args
    ablations: {}                                  # name: args（= prereg §6 的项）
    extra: {}

results:                    # G4，scripts/results_check.py 机械执行
  main_table: results/main.csv        # 列：run_id, <group_key>, seed, <指标列...>；口径写在表头或 results/main.md
  ablation_table: results/ablation.csv # 列：ablation（= prereg §6 的项）, run_id, seed, <指标列...>
  runs_dir: runs
  eval_file: eval.json                # runs/<run_id>/ 下的指标文件
  freshness_ref: log.json             # eval_file 必须新于它（训练结束前的评估 = 陈旧）
  metric_map: {}                      # main.csv 列 -> eval_file 内的点路径，如 {rmse_E1: E1_in_domain.rmse_contact}
  primary_metric: ""                  # 必须是 main.csv 的列且在 prereg §2 出现
  min_seeds: 3
  seed_waiver: ""                     # 非空 = 接受此理由代替 ≥min_seeds
  group_key: method
  reference_method: ours              # ablation_plan.py resolve 用：消融 Δ 的参照与 σ_ref 来源
  predictions: []                     # 事前预测符号检验：- {a: ours, b: no_dom, metric: rmse_E5, sign: "+"}；反号且 findings.md 无记录 = FAIL
  reproductions: []                   # 基线复现 vs 原论文报告值：- {method: RCNN, metric: rmse_E1, reported: 0.52, reported_std: 0.03}（tol 默认 2×std，或直接给 tol）；超差且 findings.md 无记录 = FAIL
  findings: findings.md               # 反常记录：每条含方法名与指标名，先记录再继续训练
  dataset_col: ""                     # 主表跨多个数据集时，消融分辨率的参照行只取与 ablation.csv 同一数据集（空 = 自动找 dataset/task/data 列）
  aliases: {}                         # 矩阵/表里的短名 -> prereg §5/§6 行的子串，如 {cwl: "中心波长", nominal: "Nominal"}；名字对不上时用
  coverage_waiver: {}                 # 本阶段不跑的 prereg 基线/消融（prereg 行子串 -> 理由），bundle check / results_check 报 WARN 不 FAIL；投稿主表不得带豁免

experiments:
  main_table: results/main.csv
  repro_table: results/repro.csv
  ablation_table: results/ablation.csv
  seeds: []
  total_runs: 0
  baseline_value: null
  best_value: null
  outer_loop:
    cycle: 0
    last_direction: ""      # deepen | broaden | pivot | conclude
    note: ""
  convention_changes: []    # 任何事后改口径都记在这里：{date, what, why}

figures:
  map: figures.csv
  inspected: []             # - {file, issues_found, fixed}

scope_audit: []             # - {line, phrase, dataset, table, ok}

review:
  log: paper/review_log.md
  round: 0
  open_major: []

submission:
  package_dir: submission/
  checklist: submission/checklist.md

survey:                     # 综述分支（branch: survey 时填），scripts/survey_check.py 读
  scope_in: ""              # 哪些算进来，一条判据
  scope_out: ""             # 哪些明确排除，一条判据
  axis: ""                  # 组织主轴：method-level | task | data | time（只选一个）
  thesis: ""                # 综述的可证伪论点（不是"我们综述了 X"）
  search_log: literature/search_log.json   # S1: {sources: [{source, query, date, count}]}
  candidates: literature/candidates.csv     # S1: one row per deduplicated candidate, with doi|pmid|arxiv_id
  screening_sheet: coding/screening_sheet.csv
  coded: coding/coded.csv
  codebook: coding/codebook.md
  prisma: literature/prisma_flow.json
  kappa: coding/kappa_results.json
  min_kappa: 0.6
  tables_dir: tables
  coverage: coding/coverage.csv
  prior_surveys: literature/prior_surveys.csv
  claims: paper/claims.csv

# gate_check.py 读取的两个列表
acronym_ok: []              # 不需展开的缩略语：期刊名、品牌名、单位（GB, GPU 已内置）
blind_terms: []             # 盲稿中不得出现的词：作者姓、单位、城市、基金号
